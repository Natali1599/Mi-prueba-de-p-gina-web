<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi primera página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>¡Hola, mundo!</h1>
  <p id="mensaje">Haz clic en el botón para cambiar este texto.</p>
  <button onclick="cambiarTexto()">Cambiar texto</button>

  <script>
    function cambiarTexto() {
      document.getElementById("mensaje").innerText = "¡Texto cambiado con JavaScript!";
    }
  </script>
</body>
</html>
